<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrieve booking — Northstar Airways</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.amplitude.com/script/f0db16a2ac68ab1c81271aeabdb148de.js"></script>
    <script src="https://cdn.amplitude.com/script/f0db16a2ac68ab1c81271aeabdb148de.engagement.js"></script>
    <script src="js/amplitude-init.js"></script>
</head>

<body>
    <header>
        <nav class="container">
            <div class="logo">
                <span class="logo-mark" aria-hidden="true"></span>
                <a href="index.html" class="logo-link">Northstar Airways</a>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="retrieve-booking.html" aria-current="page">My booking</a></li>
                <li><a href="check-in.html">Check in</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-main">
        <div class="container narrow">
            <h1 class="section-title">Retrieve your booking</h1>
            <p class="section-lead">Enter your booking reference to view the itinerary. Last name is optional (use it for extra verification). Demo: <strong>NS-DEMO01</strong> or any reference shown after you buy a flight.</p>

            <div class="booking-panel">
                <form id="retrieveForm" class="booking-form">
                    <div class="form-group">
                        <label for="bookingId">Booking reference</label>
                        <input type="text" id="bookingId" name="bookingId" placeholder="NS-DEMO01" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="lastName">Last name <span class="label-hint">(optional)</span></label>
                        <input type="text" id="lastName" name="lastName" placeholder="Only if verifying passenger name">
                    </div>
                    <button type="submit" class="btn">Find booking</button>
                </form>
                <p id="retrieveError" class="form-message form-message--error hidden" role="alert"></p>
            </div>

            <div id="bookingResult" class="booking-result hidden" aria-live="polite"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Northstar Airways. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/bookings.js"></script>
    <script src="script.js?v=7"></script>
    <script src="js/retrieve-booking.js"></script>
</body>

</html>
